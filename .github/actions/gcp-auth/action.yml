# =============================================================================
# Authentification GCP — deux chemins, une seule interface.
#
# Par défaut : Workload Identity Federation (OIDC). Aucun secret de longue
# durée dans GitHub, et le jeton est restreint à ce dépôt par une condition
# d'attribut posée à la création du provider (voir scripts/bootstrap-ci.sh).
#
# Repli : clé de service JSON, si l'organisation GitHub n'expose pas OIDC.
#
# Factorisé en action composite parce que les secrets se passent ici en
# `inputs` explicites — plus lisible que de dupliquer deux étapes
# conditionnelles dans chacun des jobs.
# =============================================================================

name: Authentification GCP
description: Authentifie le runner auprès de Google Cloud (WIF ou clé de service)

inputs:
  project_id:
    description: Identifiant du projet GCP
    required: true
  wif_provider:
    description: Chemin complet du provider Workload Identity. Prioritaire s'il est fourni.
    required: false
    default: ''
  service_account:
    description: Compte de service à emprunter (requis avec wif_provider)
    required: false
    default: ''
  sa_key:
    description: Clé de service JSON (repli, utilisée si wif_provider est vide)
    required: false
    default: ''
  token_format:
    description: >-
      Mettre « access_token » pour exposer un jeton OAuth en sortie. Nécessaire
      pour s'authentifier auprès d'Artifact Registry sans passer par le
      credential helper de gcloud.
    required: false
    default: ''

outputs:
  access_token:
    description: Jeton OAuth, non vide seulement si token_format vaut « access_token ».
    value: ${{ steps.wif.outputs.access_token || steps.key.outputs.access_token }}

runs:
  using: composite
  steps:
    - name: Workload Identity Federation
      id: wif
      if: inputs.wif_provider != ''
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: ${{ inputs.token_format }}

    - name: Clé de service
      id: key
      if: inputs.wif_provider == ''
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.project_id }}
        credentials_json: ${{ inputs.sa_key }}
        token_format: ${{ inputs.token_format }}

    - name: Vérifier l'identité obtenue
      shell: bash
      run: |
        echo "Identité active : $(gcloud config get-value account 2>/dev/null || echo inconnue)"
        echo "Projet          : ${{ inputs.project_id }}"
